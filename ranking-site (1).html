<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색지수 랭킹 — 지금 가장 많이 검색된 것들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#E7E9F0;
  --card:#FFFFFF;
  --ink:#101320;
  --muted:#6E7488;
  --line:#D2D6E2;
  --up:#E2342A;
  --down:#1E5BD6;
  --flat:#9AA0B1;
  --kr:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--kr);
  font-size:15px;line-height:1.5;letter-spacing:-.01em;
  padding-bottom:64px;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--down);outline-offset:2px;border-radius:2px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;background:rgba(231,233,240,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--up)}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0}
.live{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- ticker ---------- */
.ticker{
  background:var(--ink);color:#F2F3F7;overflow:hidden;
  border-bottom:1px solid var(--ink);
}
.ticker-in{display:flex;align-items:center;gap:0}
.ticker-tag{
  flex:none;padding:9px 14px;background:var(--up);color:#fff;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;
}
.ticker-track{overflow:hidden;flex:1;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 92%,transparent)}
.ticker-run{display:flex;gap:34px;white-space:nowrap;padding:9px 24px;animation:slide 46s linear infinite}
.ticker:hover .ticker-run{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-size:13px;display:inline-flex;align-items:baseline;gap:7px}
.tk .cat{color:#8C93A8;font-family:var(--mono);font-size:11px}
.tk .up{color:#FF8A80;font-family:var(--mono);font-size:11.5px}

/* ---------- controls ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:22px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{
  font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--muted);transition:.15s;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.find{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:8px 12px;font-size:13.5px;width:210px;font-family:var(--kr);
}
.find::placeholder{color:var(--flat)}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 0 18px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(302px,1fr));gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 16px 12px;text-align:left;width:100%;display:block;
  transition:border-color .16s,transform .16s;
}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.grp{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hotmark{font-family:var(--mono);font-size:10px;color:var(--up);letter-spacing:.04em}
.cat-name{font-size:17.5px;font-weight:700;letter-spacing:-.03em;margin-bottom:13px}

/* rank rows */
.row{display:grid;grid-template-columns:15px 1fr 40px 34px;align-items:center;gap:9px;padding:5px 0}
.rk{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--flat)}
.row.first .rk{color:var(--up)}
.nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.first .nm{font-weight:700}
.idx{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
.mv{font-family:var(--mono);font-size:11px;text-align:right}
.mv.u{color:var(--up)}.mv.d{color:var(--down)}.mv.f{color:var(--flat)}
.mv.n{color:var(--up);font-weight:600}
.bar{grid-column:2 / -1;height:3px;background:#EDEFF4;border-radius:2px;overflow:hidden;margin:-3px 0 3px}
.bar i{display:block;height:100%;background:var(--flat);width:0;border-radius:2px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row.first + .bar i{background:var(--up)}
.more{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;
  border-top:1px solid #EDEFF4;margin-top:8px;padding-top:9px;display:block;
}
.card:hover .more{color:var(--ink)}

/* ---------- detail ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,19,32,.55);z-index:50;display:none;padding:20px;overflow-y:auto}
.scrim.on{display:block}
.sheet{
  background:var(--card);max-width:600px;margin:6vh auto;border-radius:14px;
  padding:24px 24px 20px;animation:rise .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sheet-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px}
.sheet h2{font-size:24px;font-weight:800;letter-spacing:-.04em}
.sheet .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:18px}
.x{font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.x:hover{color:var(--ink)}
.full{border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:22px 1fr 52px 42px;align-items:center;gap:10px;padding:11px 0 4px}
.fbar{grid-column:2 / -1;height:4px;background:#EDEFF4;border-radius:2px;overflow:hidden;margin-bottom:11px;border-bottom:0}
.fbar i{display:block;height:100%;background:var(--flat);border-radius:2px}
.frow.first .rk,.frow.first .nm{color:var(--ink)}
.frow.first .rk{color:var(--up);font-size:14px}
.frow.first .nm{font-weight:700;font-size:16px}
.frow + .fbar{border-bottom:1px solid #F1F2F6}
.frow.first + .fbar i{background:var(--up)}
.note{font-size:11.5px;color:var(--muted);line-height:1.65;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.note b{color:var(--ink);font-weight:600}

.foot{max-width:1240px;margin:44px auto 0;padding:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}

@media (max-width:640px){
  .brand{font-size:17px}
  .find{width:100%}
  .sheet{padding:20px 16px 16px;margin:0 auto}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bar i{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="brand">검색지수 <em>랭킹</em></span>
    <span class="stamp live"><span class="dot"></span><span id="stamp"></span> 기준 · 최근 7일 검색지수</span>
  </div>
</header>

<div class="ticker">
  <div class="ticker-in">
    <span class="ticker-tag">급상승</span>
    <div class="ticker-track"><div class="ticker-run" id="ticker"></div></div>
  </div>
</div>

<main class="wrap">
  <div class="controls">
    <div class="chips" id="chips"></div>
    <input class="find" id="find" type="search" placeholder="분야 검색 (예: 노트북)" aria-label="분야 검색">
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  순위는 검색량 지수를 기준으로 자동 집계됩니다. 검색량이 많다는 것이 품질·선호·평판이 높다는 뜻은 아닙니다.<br>
  현재 화면의 수치는 UI 확인용 <b>샘플 데이터</b>입니다.
</footer>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

/* 샘플 지수/등락 생성 (실서비스에서는 서버 집계값 사용) */
function seeded(s){let x=(s*2654435761)>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
const DATA = RAW.map(([name,group,items],ci)=>{
  const r = seeded(ci+7);
  let v = 100, list = [];
  items.forEach((nm,i)=>{
    if(i) v = Math.max(6, v*(0.70+0.26*r()));
    const q = r();
    let mv;
    if(q>0.94) mv = "NEW";
    else mv = Math.round((r()-0.5)*7);
    list.push({name:nm, idx:Math.round(v), mv});
  });
  const lead = list[0].mv === "NEW" ? 9 : Math.abs(list[0].mv);
  return {id:"c"+ci, name, group, list, heat: lead*10 + r()*10};
}).sort((a,b)=>b.heat-a.heat);

/* ============================================================
   2. 렌더링
   ============================================================ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const now = new Date();
$("#stamp").textContent = `${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,"0")}:00`;

function mvHTML(mv){
  if(mv==="NEW") return `<span class="mv n">NEW</span>`;
  if(mv>0) return `<span class="mv u">▲${mv}</span>`;
  if(mv<0) return `<span class="mv d">▼${-mv}</span>`;
  return `<span class="mv f">–</span>`;
}

/* 급상승 티커 */
const hot = DATA.filter(c=>c.list[0].mv==="NEW"||c.list[0].mv>=2).slice(0,14)
  .map(c=>`<span class="tk"><span class="cat">${esc(c.group)}</span> ${esc(c.name)} 1위 <b>${esc(c.list[0].name)}</b> <span class="up">${c.list[0].mv==="NEW"?"NEW":"▲"+c.list[0].mv}</span></span>`).join("");
$("#ticker").innerHTML = hot + hot;

/* 그룹 필터 */
const GROUPS = ["전체", ...[...new Set(DATA.map(c=>c.group))]];
let active = "전체", query = "";
$("#chips").innerHTML = GROUPS.map(g=>
  `<button class="chip" data-g="${esc(g)}" aria-pressed="${g==="전체"}">${esc(g)}</button>`).join("");
$("#chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  active = b.dataset.g;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
  render();
});
$("#find").addEventListener("input", e=>{ query = e.target.value.trim(); render(); });

function render(){
  const list = DATA.filter(c=>
    (active==="전체"||c.group===active) &&
    (!query || c.name.includes(query) || c.list.some(i=>i.name.includes(query)))
  );
  $("#count").textContent = `${list.length}개 분야 · 화제성 높은 순`;
  $("#grid").innerHTML = list.map(c=>{
    const top = c.list.slice(0,3);
    const rows = top.map((it,i)=>`
      <div class="row${i===0?" first":""}">
        <span class="rk">${i+1}</span>
        <span class="nm">${esc(it.name)}</span>
        <span class="idx">${it.idx}</span>
        ${mvHTML(it.mv)}
      </div>
      <div class="bar"><i data-w="${it.idx}"></i></div>`).join("");
    return `<button class="card" data-id="${c.id}">
      <div class="card-hd"><span class="grp">${esc(c.group)}</span>${c.heat>60?'<span class="hotmark">HOT</span>':""}</div>
      <div class="cat-name">${esc(c.name)}</div>
      ${rows}
      <span class="more">10위까지 보기 →</span>
    </button>`;
  }).join("");
  requestAnimationFrame(()=>document.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%"));
}
render();

/* 상세 */
$("#grid").addEventListener("click", e=>{
  const card = e.target.closest(".card"); if(!card) return;
  open(DATA.find(c=>c.id===card.dataset.id));
});
function open(c){
  $("#sheet").innerHTML = `
    <div class="sheet-hd">
      <div>
        <h2 id="sheetTitle">${esc(c.name)}</h2>
        <div class="sub">${esc(c.group)} · 최근 7일 검색지수 · 1위 = 100 기준</div>
      </div>
      <button class="x" id="close" aria-label="닫기">×</button>
    </div>
    <div class="full">
      ${c.list.map((it,i)=>`
        <div class="frow${i===0?" first":""}">
          <span class="rk">${i+1}</span>
          <span class="nm">${esc(it.name)}</span>
          <span class="idx">${it.idx}</span>
          ${mvHTML(it.mv)}
        </div>
        <div class="fbar"><i style="width:${it.idx}%"></i></div>`).join("")}
    </div>
    <p class="note">
      <b>집계 방식</b> · 네이버 데이터랩 검색어트렌드와 검색광고 키워드 조회수를 결합해 매일 06시에 갱신합니다.
      등락은 지난주 같은 요일 순위와 비교한 값입니다.<br><br>
      <b>검색량은 인기·품질과 다릅니다.</b> 부정적 이슈로도 검색량은 급증합니다. 이 표는 "가장 많이 검색된 순서"만 보여줍니다.
    </p>`;
  $("#scrim").classList.add("on");
  document.body.style.overflow="hidden";
  $("#close").focus();
}
function close(){ $("#scrim").classList.remove("on"); document.body.style.overflow=""; }
$("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim"||e.target.id==="close") close(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") close(); });
</script>
